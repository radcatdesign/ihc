    <style>
      .splitting .char,
      .splitting .word {
        display: inline-block
      }

      .splitting .char {
        position: relative;
        --char-percent: calc(var(--char-index) / var(--char-total));
        --char-offset: calc(var(--char-index) - var(--char-center));
        --distance: calc((var(--char-offset) * var(--char-offset)) / var(--char-center));
        --distance-sine: calc(var(--char-offset) / var(--char-center));
        --distance-percent: calc((var(--distance) / var(--char-center)))
      }

      .splitting .char::after,
      .splitting .char::before {
        content: attr(data-char);
        position: absolute;
        top: 0;
        left: 0;
        visibility: hidden;
        transition: inherit;
        user-select: none
      }

      .splitting {
        --word-center: calc((var(--word-total) - 1) / 2);
        --char-center: calc((var(--char-total) - 1) / 2);
        --line-center: calc((var(--line-total) - 1) / 2)
      }

      .splitting .word {
        --word-percent: calc(var(--word-index) / var(--word-total));
        --line-percent: calc(var(--line-index) / var(--line-total))
      }

      .splitting.cells img {
        width: 100%;
        display: block
      }

      @supports (display:grid) {
        .splitting.cells {
          position: relative;
          overflow: hidden;
          background-size: cover;
          visibility: hidden
        }

        .splitting .cell-grid {
          background: inherit;
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          display: grid;
          grid-template: repeat(var(--row-total), 1fr)/repeat(var(--col-total), 1fr)
        }

        .splitting .cell {
          background: inherit;
          position: relative;
          overflow: hidden;
          --center-x: calc((var(--col-total) - 1) / 2);
          --center-y: calc((var(--row-total) - 1) / 2);
          --offset-x: calc(var(--col-index) - var(--center-x));
          --offset-y: calc(var(--row-index) - var(--center-y));
          --distance-x: calc((var(--offset-x) * var(--offset-x)) / var(--center-x));
          --distance-y: calc((var(--offset-y) * var(--offset-y)) / var(--center-y))
        }

        .splitting .cell-inner {
          background: inherit;
          position: absolute;
          visibility: visible;
          width: calc(100% * var(--col-total));
          height: calc(100% * var(--row-total));
          left: calc(-100% * var(--col-index));
          top: calc(-100% * var(--row-index))
        }
      }
    </style>

        <script>
          function initTopRight() {
            const topRightEl = document.getElementById('c-top-right');
            const searchInputEl = document.getElementById('c-top-right__popup-search__input');
            const searchResultsEl = document.getElementById('c-top-right__popup-search__results');

            topRightEl.querySelectorAll('[data-top-btn]').forEach(btn => {
              btn.addEventListener('click', () => {
                topRightEl.dataset.popup = topRightEl.dataset.popup === btn.dataset.topBtn ? '' : btn.dataset.topBtn;
                if (btn.dataset.topBtn === 'search') searchInputEl.focus();

                const filterEl = document.querySelector('.p-home__bottom-right .p-home__bottom-right__w .p-home__bottom-right__btn');
                if (filterEl) filterEl.classList.remove('active');
              });
            });


            searchInputEl.addEventListener('input', e => {
              if (e.target.value.length < 1) {
                searchResultsEl.innerHTML = '';
                return;
              }
              const res = window.csList.filter(c => {
                let valid = false;
                if (c.name.toLowerCase().indexOf(e.target.value.toLowerCase()) > -1) valid = true;
                if (c.client && c.client.toLowerCase().indexOf(e.target.value.toLowerCase()) > -1) valid = true;
                return valid;
              });
              const html = res.map(r => {
                const link = window.location.origin + '/case-study/' + r.slug;
                return `<a href="${link}" onclick="searchClick(event, this)" class="c-top-right__popup-search__results__item" data-has-marquee>
          	<div class="c-top-right__popup-search__results__item__text">${r.name}</div>
            <div data-marquee="left" class="c-top-right__popup-search__results__item__marquee">
            	<div data-marquee-content class="c-top-right__popup-search__results__item__text">${r.name}</div>
              <div data-marquee-content class="c-top-right__popup-search__results__item__text">${r.name}</div>
            </div>
          </a>`;
              });
              searchResultsEl.innerHTML = html.join('');

              searchResultsEl.querySelectorAll('[data-has-marquee]').forEach(el => {
                if (el.firstElementChild.offsetWidth < el.firstElementChild.scrollWidth) el.dataset.hasMarquee = 't';
              });
            });
          }
          initTopRight();

          function searchClick(e, el) {
            e.preventDefault();
            document.getElementById('c-top-right').dataset.popup = '';
            runPageTransition(el, 'red', true);
          }
        </script>


        <script>
          async function getList(url) {
            const res = await fetch(url).then(response => response.text());
            const parser = new DOMParser();
            const doc = parser.parseFromString(res, 'text/html');

            function getInnerText(el) {
              return el ? el.innerText : ''
            }

            function getInnerTextBool(el) {
              return el && el.innerText === 'true' ? true : false
            }

            function getServices(item) {
              const serviceEls = item.querySelectorAll('.q-services-item');
              return Array.from(serviceEls).map(s => s.querySelector('.q-services-slug').innerText);
            }

            const list = [];
            const items = doc.querySelectorAll('.q-item').forEach(p => {
              const d = new Date(getInnerText(p.querySelector('.q-date')));
              const slug = getInnerText(p.querySelector('.q-slug'));

              list.push({
                slug: slug,
                showOnHomePage: getInnerTextBool(p.querySelector('.q-show-homepage')),
                name: getInnerText(p.querySelector('.q-name')),
                client: getInnerText(p.querySelector('.q-client')),
                category: getInnerText(p.querySelector('.q-category')),
                image: getInnerText(p.querySelector('.q-image')),
                gif: getInnerText(p.querySelector('.q-gif')),
                vimeoId: getInnerText(p.querySelector('.q-vimeo')),
                services: getServices(p.parentElement),
                ip: getInnerText(p.querySelector('.q-ip')),
                isAward: getInnerTextBool(p.querySelector('.q-is-award')),
                awardTitle: getInnerText(p.querySelector('.q-award-title')),
                awardLogo1: getInnerText(p.querySelector('.q-award-logo-1')),
                awardLogo2: getInnerText(p.querySelector('.q-award-logo-2')),
              });
            });
            return list;
          }

          async function buildPage() {
            window.csList = await getList(`${window.location.origin}/cms/cs`);
          }
          buildPage();


          function menuBackdrop() {
            const backdropEl = document.createElement('div');
            backdropEl.classList.add('c-top-right__backdrop');
            document.body.appendChild(backdropEl);
            const topRightEl = document.getElementById('c-top-right');
            if (!backdropEl || !topRightEl) return;

            document.querySelectorAll('.c-top-right__backdrop').forEach(el => {
              el.addEventListener('click', () => {
                topRightEl.dataset.popup = '';
              });
            });
          }
          window.setTimeout(menuBackdrop, 500);


          function newsletterForm() {
            const popupJoin = document.querySelector("#c-top-right .c-top-right__popup-join");
            if (!popupJoin) return;
            const successEl = popupJoin.querySelector(".c-top-right__popup-join__success");
            if (!successEl) return;

            const callback = (mutationList, observer) => {
              for (const mutation of mutationList) {
                const display = window.getComputedStyle(successEl).display
                if (display === 'block') {
                  observer.disconnect();
                  popupJoin.classList.add('success');
                }
              }
            };

            const observer = new MutationObserver(callback);
            observer.observe(successEl, {
              attributes: true,
              childList: false,
              subtree: false
            });
          }
          newsletterForm();
        </script>

      <div class="embed-script w-embed w-script">
        <script>
          function runPageTransition(linkEl, toColor = '', isVertical = false) {
            const pTransitionEl = document.getElementById('c-page-transition');
            if (isVertical || linkEl.dataset.pageTransitionDirection === 'vertical') {
              pTransitionEl.dataset.noAnim = 't';
              window.setTimeout(() => {
                if (linkEl.dataset.pageTransitionDirectionInverted === 't') {
                  pTransitionEl.dataset.verticalInverted = 't';
                } else {
                  pTransitionEl.dataset.vertical = 't';
                }
                window.setTimeout(() => {
                  pTransitionEl.dataset.noAnim = '';
                }, 20);
              }, 20);
            }

            const savedColor = sessionStorage.getItem('config-page-color');
            const isToHome = linkEl && linkEl.href && linkEl.href.indexOf('/?skip-anim=t') > 0;
            const isToWork = linkEl && linkEl.href && linkEl.href.indexOf('/work') > 0;
            if ((isToHome || isToWork) && savedColor) toColor = savedColor;

            if (toColor === 'blue' || linkEl.dataset.pageTransition === 'blue') pTransitionEl.classList.add('to-blue');
            if (toColor === 'red' || linkEl.dataset.pageTransition === 'red') pTransitionEl.classList.add('to-red');
            if (toColor === 'neonpurp' || linkEl.dataset.pageTransition === 'neonpurp') pTransitionEl.classList.add('to-neonpurp');

            window.setTimeout(() => {
              pTransitionEl.classList.add('active');

              const isSameDomain = document.referrer.indexOf(window.location.host) > -1;
              let nextPageLink = '';

              if (linkEl.dataset.routeBack && isSameDomain) {
                if (
                  document.referrer.indexOf('/work') > -1 ||
                  document.referrer.indexOf(window.location.origin + '/?skip-anim=t') > -1
                ) {
                  window.setTimeout(() => {
                    history.back();
                  }, 1000);
                } else if (document.referrer === window.location.origin + '/') {
                  nextPageLink = window.location.origin + '/?skip-anim=t';
                } else {
                  nextPageLink = linkEl.dataset.link ? linkEl.dataset.link : linkEl.href;
                }
              } else {
                nextPageLink = linkEl.dataset.link ? linkEl.dataset.link : linkEl.href;
              }

              if (nextPageLink) {
                const prefetchEl = document.createElement('link');
                prefetchEl.rel = 'prefetch';
                prefetchEl.href = nextPageLink;
                document.body.appendChild(prefetchEl);

                window.setTimeout(() => {
                  window.location.href = nextPageLink;
                }, 1000);
              }
            }, 50);
          }

          function pageTransitionEvents() {
            document.querySelectorAll('[data-page-transition]:not([data-page-transition-added])').forEach(btn => {
              btn.dataset.pageTransitionAdded = 't';
              btn.addEventListener('click', e => {
                e.preventDefault();
                e.stopPropagation();
                runPageTransition(btn);
              });
            });
          }
          pageTransitionEvents();
        </script>

      <script>
        function heroBalls() {
          const wrapperEl = document.getElementById('balls-wrapper');
          const isMobileOrDesktop = window.innerHeight < 992;
          if (!wrapperEl) return;
          const wrapperB = wrapperEl.getBoundingClientRect();

          const balls = Array.from(wrapperEl.children).map((ball, index) => {
            const b = ball.getBoundingClientRect();
            ball.style.width = `${b.width}px`;
            return {
              elem: ball,
              body: Matter.Bodies.circle(wrapperB.width / 2, wrapperB.height / 2, b.width / 2 - 10, {
                restitution: 0.5,
                friction: isMobileOrDesktop ? 0.001 : 0.01,
                frictionAir: 0.005,
                frictionStatic: isMobileOrDesktop ? 0.0001 : 0.01,
                density: 0.001,
                inertia: Infinity,
                label: 'ball',
